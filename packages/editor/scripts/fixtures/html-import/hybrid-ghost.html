<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Hybrid launch</title>
<!--[if mso]><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml><![endif]-->
<style>
  html, body { margin: 0 auto !important; padding: 0 !important; height: 100% !important; width: 100% !important; }
  * { -ms-text-size-adjust: 100%; -webkit-text-size-adjust: 100%; }
  table, td { mso-table-lspace: 0pt !important; mso-table-rspace: 0pt !important; }
  table { border-spacing: 0 !important; border-collapse: collapse !important; table-layout: fixed !important; margin: 0 auto !important; }
  img { -ms-interpolation-mode: bicubic; }
  a { text-decoration: none; }
  @media screen and (max-width: 600px) {
    .email-container { width: 100% !important; margin: auto !important; }
    .fluid { max-width: 100% !important; height: auto !important; margin-left: auto !important; margin-right: auto !important; }
    .stack-column, .stack-column-center { display: block !important; width: 100% !important; max-width: 100% !important; direction: ltr !important; }
    .stack-column-center { text-align: center !important; }
    .center-on-narrow { text-align: center !important; display: block !important; margin-left: auto !important; margin-right: auto !important; float: none !important; }
    table.center-on-narrow { display: inline-block !important; }
  }
</style>
</head>
<body width="100%" style="margin: 0; padding: 0 !important; mso-line-height-rule: exactly; background-color: #222222;">
<center style="width: 100%; background-color: #222222; text-align: left;">
  <!--[if mso | IE]><table role="presentation" border="0" cellspacing="0" cellpadding="0" width="100%" style="background-color: #222222;"><tr><td><![endif]-->
  <div style="display: none; font-size: 1px; line-height: 1px; max-height: 0px; max-width: 0px; opacity: 0; overflow: hidden; mso-hide: all; font-family: sans-serif;">Launch day is here. See what is new.</div>
  <div style="max-width: 600px; margin: 0 auto;" class="email-container">
    <!--[if mso]><table align="center" role="presentation" cellspacing="0" cellpadding="0" border="0" width="600"><tr><td><![endif]-->
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="margin: auto;">
      <tr>
        <td style="padding: 20px 0; text-align: center"><img src="https://cdn.example.com/hybrid-logo.png" width="200" height="50" alt="Logo" border="0" style="height: auto; background: #dddddd; font-family: sans-serif; font-size: 15px; line-height: 15px; color: #555555;"></td>
      </tr>
      <tr>
        <td style="background-color: #ffffff;"><img src="https://cdn.example.com/hybrid-hero.jpg" width="600" height="" alt="Hero" border="0" style="width: 100%; max-width: 600px; height: auto; background: #dddddd; font-family: sans-serif; font-size: 15px; line-height: 15px; color: #555555; margin: auto; display: block;" class="g-img"></td>
      </tr>
      <tr>
        <td style="background-color: #ffffff;">
          <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
            <tr><td style="padding: 40px 40px 20px; text-align: center;"><h1 style="margin: 0; font-family: sans-serif; font-size: 24px; line-height: 27px; color: #333333; font-weight: normal;">Launch day is here</h1></td></tr>
            <tr><td style="padding: 0 40px 40px; font-family: sans-serif; font-size: 15px; line-height: 20px; color: #555555; text-align: center;"><p style="margin: 0;">Everything you asked for, in one release.</p></td></tr>
            <tr><td style="padding: 0 40px 40px;">
              <table align="center" role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin: auto;">
                <tr><td class="button-td button-td-primary" style="border-radius: 4px; background: #222222;"><a class="button-a button-a-primary" href="https://example.com/launch" style="background: #222222; border: 1px solid #000000; font-family: sans-serif; font-size: 15px; line-height: 15px; text-decoration: none; padding: 13px 17px; color: #ffffff; display: block; border-radius: 4px;">Primary Button</a></td></tr>
              </table>
            </td></tr>
          </table>
        </td>
      </tr>
      <tr>
        <td align="center" valign="top" style="font-size: 0; background-color: #ffffff;">
          <!--[if mso]><table role="presentation" border="0" cellspacing="0" cellpadding="0" width="600"><tr><td valign="top" width="300"><![endif]-->
          <div style="display: inline-block; margin: 0 -2px; max-width: 50%; min-width: 240px; vertical-align: top; width: 100%;" class="stack-column">
            <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
              <tr><td style="padding: 10px 10px;">
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="font-size: 14px; text-align: left;">
                  <tr><td><img src="https://cdn.example.com/c1.jpg" width="280" alt="Left" border="0" class="fluid" style="width: 100%; max-width: 280px; height: auto; background: #dddddd;"></td></tr>
                  <tr><td style="font-family: sans-serif; font-size: 15px; line-height: 20px; color: #555555; padding: 10px 10px 0; text-align: left;" class="center-on-narrow"><h2 style="margin: 0 0 10px 0; font-family: sans-serif; font-size: 18px; line-height: 22px; color: #333333; font-weight: bold;">Left heading</h2><p style="margin: 0 0 10px 0;">Left copy text.</p></td></tr>
                </table>
              </td></tr>
            </table>
          </div>
          <!--[if mso]></td><td valign="top" width="300"><![endif]-->
          <div style="display: inline-block; margin: 0 -2px; max-width: 50%; min-width: 240px; vertical-align: top; width: 100%;" class="stack-column">
            <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
              <tr><td style="padding: 10px 10px;">
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="font-size: 14px; text-align: left;">
                  <tr><td><img src="https://cdn.example.com/c2.jpg" width="280" alt="Right" border="0" class="fluid" style="width: 100%; max-width: 280px; height: auto; background: #dddddd;"></td></tr>
                  <tr><td style="font-family: sans-serif; font-size: 15px; line-height: 20px; color: #555555; padding: 10px 10px 0; text-align: left;" class="center-on-narrow"><h2 style="margin: 0 0 10px 0; font-family: sans-serif; font-size: 18px; line-height: 22px; color: #333333; font-weight: bold;">Right heading</h2><p style="margin: 0 0 10px 0;">Right copy text.</p></td></tr>
                </table>
              </td></tr>
            </table>
          </div>
          <!--[if mso]></td></tr></table><![endif]-->
        </td>
      </tr>
      <tr>
        <td style="padding: 20px; font-family: sans-serif; font-size: 12px; line-height: 15px; text-align: center; color: #888888;">Company Name, 123 Fake Street<br><a href="https://example.com/unsubscribe" style="color: #888888; text-decoration: underline;">unsubscribe</a></td>
      </tr>
    </table>
    <!--[if mso]></td></tr></table><![endif]-->
  </div>
  <!--[if mso | IE]></td></tr></table><![endif]-->
</center>
</body>
</html>
